<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Heist animation prototype</title>
<style>
  :root { --bg:#0d0b08; --card:#16130e; --line:#2c261c; --gold:#d9a83a; --text:#eee3c8; --mute:#8d826b; --red:#e0533c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: ui-monospace, Consolas, monospace; overflow:hidden; }
  header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid var(--line); }
  .bal small { display:block; font-size:9px; color:var(--mute); letter-spacing:.2em; }
  .bal b { font-size:16px; }
  .bal.bump b { animation: bump .45s ease; color: var(--gold); }
  @keyframes bump { 50% { transform: scale(1.25); } }
  main { display:grid; place-items:center; height:calc(100vh - 64px); }
  .stage { width:420px; text-align:center; }
  .vault { position:relative; width:220px; height:220px; margin:0 auto; }
  .door { position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 40% 35%, #5d5f66, #2e3036 70%); border:6px solid #1a1b1f; box-shadow: inset 0 0 0 10px #44464d; transform-origin: left center; transition: transform .9s cubic-bezier(.3,.1,.2,1); }
  .vault.open .door { transform: perspective(600px) rotateY(-78deg); }
  .inside { position:absolute; inset:14px; border-radius:50%; background:radial-gradient(circle, #f2c75a 0 30%, #7a5a1c 70%); box-shadow: 0 0 40px #d9a83a88; }
  .dial { position:absolute; left:50%; top:50%; width:86px; height:86px; margin:-43px; border-radius:50%; background:#1d1e22; border:4px solid #888b93; }
  .dial::after { content:""; position:absolute; left:50%; top:6px; width:4px; height:16px; margin-left:-2px; background:var(--gold); }
  .vault.picking .dial { animation: twist 2.4s cubic-bezier(.4,0,.6,1); }
  @keyframes twist { 0%{transform:rotate(0)} 30%{transform:rotate(250deg)} 55%{transform:rotate(120deg)} 80%{transform:rotate(330deg)} 100%{transform:rotate(300deg)} }
  .pins { display:flex; gap:8px; justify-content:center; margin:22px 0 10px; }
  .pin { width:14px; height:34px; border:1px solid var(--line); background:var(--card); position:relative; overflow:hidden; }
  .pin i { position:absolute; left:0; right:0; bottom:0; height:30%; background:#555; transition: height .25s, background .25s; }
  .pin.set i { height:100%; background:var(--gold); }
  .bar { height:6px; background:var(--card); border:1px solid var(--line); }
  .bar div { height:100%; width:0; background:var(--gold); }
  .label { min-height:28px; margin-top:14px; font-size:18px; letter-spacing:.12em; text-transform:uppercase; }
  .win { color:var(--gold); } .lose { color:var(--red); }
  button { margin-top:16px; background:var(--gold); color:#1a1208; border:0; padding:12px 28px; font:700 13px ui-monospace, monospace; letter-spacing:.18em; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .force { margin-top:10px; font-size:11px; color:var(--mute); }
  .force label { margin:0 8px; cursor:pointer; }
  .alarm { position:fixed; inset:0; pointer-events:none; opacity:0; background: radial-gradient(circle, transparent 40%, #e0533c66); }
  .alarm.on { animation: alarm .5s 4; }
  @keyframes alarm { 50% { opacity:1; } }
  .shake { animation: shake .4s 2; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .coin { position:fixed; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ffe08a, #c08a1e); border:1px solid #7a5a1c; z-index:9; pointer-events:none; }
</style>
</head>
<body>
<header>
  <span style="font-size:12px;color:var(--mute)">Heat <b style="color:var(--text)">12</b> Low</span>
  <div class="bal" id="bal"><small>TOTAL BALANCE</small><b id="amt">$25,000</b></div>
</header>
<main>
  <div class="stage" id="stage">
    <div class="vault" id="vault"><div class="inside"></div><div class="door"><div class="dial"></div></div></div>
    <div class="pins" id="pins"></div>
    <div class="bar"><div id="fill"></div></div>
    <p class="label" id="label">Target: Nell Crowe · Steel Lvl.3</p>
    <button id="go">Start heist</button>
    <div class="force">Outcome:
      <label><input type="radio" name="o" value="rand" checked> random</label>
      <label><input type="radio" name="o" value="win"> success</label>
      <label><input type="radio" name="o" value="lose"> fail</label>
    </div>
  </div>
</main>
<div class="alarm" id="alarm"></div>
<script>
const $ = (id) => document.getElementById(id)
let balance = 25000
const fmt = (n) => '$' + Math.round(n).toLocaleString('en-US')
const pins = $('pins')
for (let i = 0; i < 5; i++) pins.innerHTML += '<div class="pin"><i></i></div>'
const wait = (ms) => new Promise((r) => setTimeout(r, ms))

function countTo(to, ms) {
  const from = balance, t0 = performance.now()
  return new Promise((done) => {
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms)
      $('amt').textContent = fmt(from + (to - from) * (1 - (1 - k) ** 3))
      if (k < 1) requestAnimationFrame(tick); else { balance = to; done() }
    }
    requestAnimationFrame(tick)
  })
}

function flyCoins(n) {
  const src = $('vault').getBoundingClientRect(), dst = $('amt').getBoundingClientRect()
  const sx = src.left + src.width / 2, sy = src.top + src.height / 2
  const dx = dst.left + dst.width / 2, dy = dst.top + dst.height / 2
  return Promise.all(Array.from({ length: n }, (_, i) => new Promise((done) => {
    const c = document.createElement('div'); c.className = 'coin'; document.body.appendChild(c)
    const burstX = sx + (Math.random() - .5) * 160, burstY = sy - 40 - Math.random() * 90
    c.animate([
      { transform: `translate(${sx - 9}px, ${sy - 9}px) scale(.6)` },
      { transform: `translate(${burstX - 9}px, ${burstY - 9}px) scale(1.1)`, offset: .35 },
      { transform: `translate(${dx - 9}px, ${dy - 9}px) scale(.5)` },
    ], { duration: 900 + Math.random() * 300, delay: i * 45, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' })
      .finished.then(() => { c.remove(); $('bal').classList.remove('bump'); void $('bal').offsetWidth; $('bal').classList.add('bump'); done() })
  })))
}

$('go').onclick = async () => {
  const go = $('go'), vault = $('vault'), label = $('label'), fill = $('fill')
  go.disabled = true
  vault.classList.remove('open'); label.className = 'label'; label.textContent = 'Picking the lock…'
  document.querySelectorAll('.pin').forEach((p) => p.classList.remove('set'))
  fill.style.transition = 'none'; fill.style.width = '0'; void fill.offsetWidth
  fill.style.transition = 'width 2.4s linear'; fill.style.width = '100%'
  vault.classList.remove('picking'); void vault.offsetWidth; vault.classList.add('picking')
  const pinEls = [...document.querySelectorAll('.pin')]
  for (const p of pinEls) { await wait(420 + Math.random() * 120); p.classList.add('set') }

  const pick = document.querySelector('input[name=o]:checked').value
  const win = pick === 'rand' ? Math.random() < .55 : pick === 'win'
  await wait(200)
  if (win) {
    const take = 4000 + Math.floor(Math.random() * 9000)
    vault.classList.add('open')
    label.className = 'label win'; label.textContent = `Cracked — +${fmt(take)}`
    await wait(500)
    await Promise.all([flyCoins(14), wait(300).then(() => countTo(balance + take, 1100))])
  } else {
    label.className = 'label lose'; label.textContent = 'Alarm tripped — nothing taken'
    $('alarm').classList.remove('on'); void $('alarm').offsetWidth; $('alarm').classList.add('on')
    $('stage').classList.remove('shake'); void $('stage').offsetWidth; $('stage').classList.add('shake')
    await wait(1800)
  }
  go.disabled = false; go.textContent = 'Run again'
}
</script>
</body>
</html>
